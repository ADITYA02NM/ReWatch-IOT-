<!doctype html>
<html lang="en" data-band="GREEN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>ReWatch(Iot) — last 5 hours</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/rewatch.css">
<style>
  body{padding:0}
  .wrap{max-width:1000px;margin:0 auto;padding:22px 20px 60px}
  .rhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:16px;margin-bottom:22px}
  .rhead .wordmark{font-size:30px}
  .rhead h1{font:400 20px var(--serif);margin:0;color:var(--muted)}
  .rhead .sp{flex:1}
  .rhead a,.rhead select{color:var(--muted);text-decoration:none;border:1px solid var(--line-2);border-radius:8px;padding:6px 12px;background:var(--panel);font:12px var(--sans)}
  .tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:24px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .tile b{display:block;font:700 30px var(--mono);font-variant-numeric:tabular-nums}
  .tile span{font:600 10px var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  h2{font:700 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px;border-bottom:1px solid var(--line);padding-bottom:6px}
  canvas#band{width:100%;height:120px;background:var(--panel);border:1px solid var(--line);border-radius:10px}
  .bandbar{display:flex;height:26px;border-radius:7px;overflow:hidden;border:1px solid var(--line);margin-top:10px}
  .bandbar b{display:flex;align-items:center;justify-content:center;font:600 10px var(--mono);color:#0b0a09;min-width:0;overflow:hidden}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font:600 10px var(--sans);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  td.t{font-family:var(--mono);color:var(--muted);white-space:nowrap}
  .sev{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:7px;vertical-align:1px}
  .s-critical{background:var(--red)}.s-high{background:#ff7a3d}.s-medium{background:var(--yellow)}.s-low{background:var(--blue)}.s-info{background:var(--green)}
  .inc{border:1px solid var(--line);border-left:3px solid var(--red);border-radius:10px;padding:12px 16px;margin-bottom:10px;background:var(--panel)}
  .inc.resolved{border-left-color:var(--green)}.inc.auto{border-left-color:var(--purple)}
  .inc h3{margin:0 0 4px;font:700 15px var(--serif)}
  .inc .meta{font:12px var(--mono);color:var(--muted)}
  .inc ol{margin:8px 0 0;padding-left:18px;color:var(--muted);font-size:12px}
  .empty{color:var(--dim);font:italic 15px var(--serif);padding:16px 0}
  @media print{body{background:#fff;color:#000}.rhead a,.rhead select{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="rhead">
    <div class="wordmark">Re<b>Watch</b></div>
    <h1 id="h1">These are the events that happened in the last 5 hours</h1>
    <span class="sp"></span>
    <select id="range">
      <option value="5" selected>Last 5 hours</option>
      <option value="1">Last hour</option>
      <option value="12">Last 12 hours</option>
      <option value="24">Last 24 hours</option>
    </select>
    <a href="/">← Dashboard</a>
  </div>

  <div class="tiles" id="tiles"></div>

  <h2>Risk over time</h2>
  <canvas id="band" width="960" height="120"></canvas>
  <div class="bandbar" id="bandbar"></div>

  <h2>Incidents</h2>
  <div id="incidents"></div>

  <h2>Event log</h2>
  <table><thead><tr><th>Time</th><th>Severity</th><th>Event</th><th>Where</th></tr></thead><tbody id="rows"></tbody></table>
</div>

<script src="assets/reports.js"></script>
</body>
</html>
