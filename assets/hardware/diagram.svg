<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc">
  <title id="title">ReWatch proposed topology and C3 signal wiring</title>
  <desc id="desc">Updated 2026-10-21. Illustration, not a photograph or validated deployment. Three Raspberry Pis connect by Ethernet to a switch or router. Sentinel needs a mirror port or TAP and has USB evidence storage. Core has an AC600 verification radio and USB C3 indicator. Herald has a TL-WN722N SMTP uplink. A separately powered Wi-Fi WROOM rig simulates rooms. C3 upload was verified, not OLED or pixel appearance.</desc>
  <rect width="1120" height="760" rx="20" fill="#0b1320"/>
  <g font-family="sans-serif" fill="#e8eef7">
    <text x="36" y="45" font-size="26" font-weight="bold">ReWatch / proposed assembly</text>
    <text x="36" y="74" fill="#f5c96b" font-size="15">ILLUSTRATION · C3 UPLOAD VERIFIED; OLED/PIXEL AND FULL DEPLOYMENT UNVERIFIED · 2026-10-21</text>
    <g fill="none" stroke="#55cbb0" stroke-width="3">
      <path d="M560 170V205H200V245 M560 205V245 M560 205H920V245"/>
      <path d="M200 340V410 M560 340V410"/>
    </g>
    <rect x="375" y="105" width="370" height="65" rx="12" fill="#20354b" stroke="#55cbb0"/>
    <text x="560" y="134" text-anchor="middle" font-size="20">Switch / router · authorized LAN</text>
    <text x="560" y="156" text-anchor="middle" font-size="13">Ethernet links below; mirror/TAP required for visibility</text>
    <g fill="#17283b" stroke="#52718d">
      <rect x="45" y="245" width="310" height="95" rx="12"/>
      <rect x="405" y="245" width="310" height="95" rx="12"/>
      <rect x="765" y="245" width="310" height="95" rx="12"/>
      <rect x="45" y="410" width="310" height="86" rx="12"/>
      <rect x="405" y="410" width="310" height="86" rx="12"/>
      <rect x="765" y="410" width="310" height="86" rx="12"/>
    </g>
    <g text-anchor="middle">
      <text x="200" y="274" font-size="20">Pi 3 Sentinel</text><text x="200" y="300" font-size="14">Observation · mirror/SPAN or TAP</text><text x="200" y="322" font-size="13">USB evidence drive</text>
      <text x="560" y="274" font-size="20">Pi 4 Core</text><text x="560" y="300" font-size="14">Broker · score · dashboard · AC600 verify</text><text x="560" y="322" font-size="13">Local firewall ≠ peer LAN isolation</text>
      <text x="920" y="274" font-size="20">Pi 3 Herald</text><text x="920" y="300" font-size="14">Alerts · TL-WN722N Wi-Fi uplink</text><text x="920" y="322" font-size="13">Validate routes and actual interfaces</text>
      <text x="200" y="442" font-size="18">Sentinel USB evidence storage</text><text x="200" y="469" font-size="13">Verify power, mounts, capacity, retention</text>
      <text x="560" y="442" font-size="18">C3 indicator · Core USB</text><text x="560" y="469" font-size="13">115200 baud · newline JSON + power</text>
      <text x="920" y="442" font-size="18">WROOM demo rig · Wi-Fi LAN</text><text x="920" y="469" font-size="13">Separate USB power · synthetic rooms</text>
    </g>
    <path d="M1020 410V190H745" stroke="#83aaff" stroke-width="2" stroke-dasharray="7 5" fill="none"/>
    <text x="1030" y="220" font-size="12" fill="#a9c2ff">Wi-Fi</text>
    <rect x="36" y="535" width="1048" height="183" rx="12" fill="#142235" stroke="#52718d"/>
    <text x="60" y="566" font-size="20">C3 signal wiring · verify actual board before connecting</text>
    <text x="60" y="600" font-size="17">GPIO5 → OLED SDA    /    GPIO6 → OLED SCL    /    GPIO8 → pixel data</text>
    <text x="60" y="630" font-size="15">SSD1306: 128 × 64, default 0x3C · common ground · verify supply and logic levels</text>
    <text x="60" y="660" font-size="15">Not a full electrical schematic. Never apply 5 V to GPIO; check USB and regulator current budgets.</text>
    <text x="60" y="690" font-size="15" fill="#f5c96b">Use suitable Pi supplies. External strips need a verified supply/interface. No mains wiring is specified.</text>
  </g>
</svg>
