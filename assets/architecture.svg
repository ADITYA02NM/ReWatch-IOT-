<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc">
  <title id="title">ReWatch(Iot) hardware architecture and data flow</title>
  <desc id="desc">Illustration of the documented hardware, not photographs. A switch or router on an authorized LAN provides a SPAN, TAP or mirrored feed to a Pi 3 Sentinel, which writes JSONL evidence to USB. The Pi 4 Core hosts the MQTT broker, scoring, dashboard and SQLite evidence and connects by Ethernet. The Pi 3 Herald subscribes to incidents and sends SMTP notifications, where relay acceptance is not inbox delivery. A laptop on the same LAN uses only a browser for dashboards, acknowledgement and capability-checked control requests. The enclosure contains an ESP32-C3 that renders engine state over Core serial by default or optional MQTT, with an OLED and LED. An ESP32-WROOM Black Hat rig models four AC rooms over plain unauthenticated Wi-Fi MQTT and never switches mains power.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7dd3fc"/></marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#94a3b8"/></marker>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#e2e8f0}
      .heading{font-size:22px;font-weight:700}.sub{font-size:15px;fill:#94a3b8}
      .label{font-size:16px;font-weight:700}.body{font-size:13px;fill:#cbd5e1}.small{font-size:12px;fill:#94a3b8}.note{font-size:13px;fill:#cbd5e1}
      .box{fill:#122439;stroke:#38546b;stroke-width:2}.flow{fill:none;stroke:#7dd3fc;stroke-width:2;marker-end:url(#arrow)}
      .net{fill:none;stroke:#94a3b8;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#dasharrow)}
      .pcb{fill:#2e7d4f;stroke:#1c5733;stroke-width:2}.chip{fill:#1d2a20}.port{fill:#cfd6dd;stroke:#8fa1b3}.hdr{fill:#d9b64a}
      .case{fill:#1e293b;stroke:#64748b;stroke-width:1.5}
    </style>
  </defs>
  <rect width="1160" height="780" rx="18" fill="#081422"/>
  <text x="36" y="42" class="heading">ReWatch(Iot) / SYSTEM ARCHITECTURE</text>
  <text x="36" y="68" class="sub">Authorized LAN observation → local scoring → operator-visible response</text>

  <!-- switch -->
  <rect x="430" y="96" width="300" height="72" rx="12" class="box"/>
  <text x="580" y="126" text-anchor="middle" class="label">Switch / router · authorized LAN</text>
  <text x="580" y="150" text-anchor="middle" class="small">SPAN / TAP / mirror port feeds capture</text>

  <!-- network links -->
  <path d="M540 168 V204 H215 V236" class="net"/>
  <text x="238" y="198" class="small">mirrored traffic</text>
  <path d="M580 168 V236" class="flow"/>
  <text x="594" y="204" class="small">Ethernet · MQTT</text>
  <path d="M620 168 V204 H945 V236" class="net"/>
  <text x="820" y="198" class="small">LAN route for SMTP</text>

  <!-- Sentinel -->
  <rect x="60" y="240" width="300" height="200" rx="12" class="box"/>
  <text x="80" y="270" class="label">Pi 3 · SENTINEL</text>
  <g transform="translate(80,286)">
    <rect width="130" height="86" rx="6" class="pcb"/>
    <rect x="10" y="6" width="110" height="7" rx="2" class="hdr"/>
    <rect x="44" y="30" width="42" height="36" rx="3" class="chip"/>
    <rect x="112" y="20" width="22" height="18" rx="2" class="port"/>
    <rect x="112" y="44" width="22" height="16" rx="2" class="port"/>
    <rect x="112" y="64" width="22" height="16" rx="2" class="port"/>
    <circle cx="18" cy="74" r="5" fill="#0b1a12"/>
  </g>
  <text x="230" y="304" class="body">Observes SPAN/TAP feed</text>
  <text x="230" y="326" class="body">detects scans, floods,</text>
  <text x="230" y="348" class="body">new devices</text>
  <rect x="80" y="386" width="44" height="24" rx="4" fill="#1d2a20" stroke="#64748b"/>
  <text x="132" y="403" class="small">USB evidence · /mnt/rewatch-usb</text>
  <text x="80" y="428" class="small">JSONL logs · local fallback if unmounted</text>

  <!-- Core -->
  <rect x="430" y="240" width="300" height="200" rx="12" class="box"/>
  <text x="450" y="270" class="label">Pi 4 · CORE</text>
  <g transform="translate(450,286)">
    <rect width="130" height="86" rx="6" class="pcb"/>
    <rect x="10" y="6" width="110" height="7" rx="2" class="hdr"/>
    <rect x="40" y="28" width="50" height="40" rx="3" class="chip"/>
    <rect x="112" y="20" width="22" height="18" rx="2" class="port"/>
    <rect x="112" y="44" width="22" height="16" rx="2" class="port"/>
    <rect x="112" y="64" width="22" height="16" rx="2" class="port"/>
    <circle cx="18" cy="74" r="5" fill="#0b1a12"/>
  </g>
  <text x="600" y="304" class="body">MQTT broker · scoring</text>
  <text x="600" y="326" class="body">dashboard · incidents</text>
  <text x="600" y="348" class="body">control requests (202)</text>
  <rect x="450" y="386" width="56" height="20" rx="4" fill="#1d2a20" stroke="#64748b"/>
  <text x="514" y="401" class="small">AC600 · HTTP verify</text>
  <text x="450" y="428" class="small">SQLite evidence · anonymous LAN MQTT by default</text>

  <!-- Herald -->
  <rect x="800" y="240" width="300" height="200" rx="12" class="box"/>
  <text x="820" y="270" class="label">Pi 3 · HERALD</text>
  <g transform="translate(820,286)">
    <rect width="130" height="86" rx="6" class="pcb"/>
    <rect x="10" y="6" width="110" height="7" rx="2" class="hdr"/>
    <rect x="44" y="30" width="42" height="36" rx="3" class="chip"/>
    <rect x="112" y="20" width="22" height="18" rx="2" class="port"/>
    <rect x="112" y="44" width="22" height="16" rx="2" class="port"/>
    <rect x="112" y="64" width="22" height="16" rx="2" class="port"/>
    <circle cx="18" cy="74" r="5" fill="#0b1a12"/>
  </g>
  <text x="970" y="304" class="body">Subscribes to Core</text>
  <text x="970" y="326" class="body">incidents over MQTT</text>
  <text x="970" y="348" class="body">sends SMTP alerts</text>
  <rect x="820" y="386" width="34" height="40" rx="4" fill="#1d2a20" stroke="#64748b"/>
  <line x1="837" y1="386" x2="837" y2="360" stroke="#8fa1b3" stroke-width="3"/>
  <text x="862" y="404" class="small">WN722N uplink</text>
  <text x="862" y="424" class="small">accepted ≠ delivery</text>

  <!-- laptop -->
  <rect x="60" y="520" width="280" height="170" rx="12" class="box"/>
  <text x="80" y="550" class="label">Laptop · browser only</text>
  <g transform="translate(96,566)">
    <rect width="110" height="70" rx="5" class="case"/>
    <rect x="7" y="7" width="96" height="52" rx="3" fill="#0f2740"/>
    <path d="M40 70 h30 l8 14 h-46 Z" fill="#64748b"/>
    <rect x="24" y="84" width="62" height="6" rx="3" fill="#94a3b8"/>
  </g>
  <text x="220" y="586" class="body">Dashboards,</text>
  <text x="220" y="606" class="body">ACK, permitted</text>
  <text x="220" y="626" class="body">control requests</text>
  <text x="80" y="674" class="small">USB only for temporary flashing</text>

  <!-- enclosure -->
  <rect x="380" y="520" width="360" height="170" rx="12" class="box"/>
  <text x="400" y="550" class="label">Enclosure · ESP32-C3 indicator</text>
  <rect x="400" y="564" width="320" height="88" rx="8" fill="none" stroke="#64748b" stroke-dasharray="6 4"/>
  <g transform="translate(414,578)">
    <rect width="72" height="52" rx="5" fill="#25608a" stroke="#173f5c" stroke-width="2"/>
    <rect x="16" y="12" width="34" height="26" rx="3" fill="#b9c4cd"/>
    <rect x="8" y="42" width="56" height="6" rx="2" class="hdr"/>
  </g>
  <g transform="translate(500,578)">
    <rect width="76" height="52" rx="5" fill="#0b1a2b" stroke="#3b82c4"/>
    <rect x="8" y="10" width="60" height="8" rx="2" fill="#589aff"/>
    <rect x="8" y="24" width="44" height="6" rx="2" fill="#589aff"/>
    <rect x="8" y="36" width="52" height="6" rx="2" fill="#589aff"/>
  </g>
  <circle cx="620" cy="604" r="14" fill="#589aff" stroke="#93c5fd" stroke-width="2"/>
  <text x="642" y="600" class="small">LED band</text>
  <text x="642" y="618" class="small">0.5–4 Hz</text>
  <text x="414" y="596" class="small" fill="#e2e8f0">C3</text>
  <text x="512" y="596" class="small" fill="#e2e8f0">OLED</text>
  <text x="400" y="674" class="small">Core serial (default) or optional MQTT · no scoring on the board</text>

  <!-- WROOM rig -->
  <rect x="775" y="520" width="325" height="170" rx="12" class="box"/>
  <text x="795" y="550" class="label">ESP32-WROOM · Black Hat rig</text>
  <g transform="translate(795,566)">
    <rect width="96" height="58" rx="5" fill="#25608a" stroke="#173f5c" stroke-width="2"/>
    <rect x="12" y="12" width="40" height="30" rx="3" fill="#b9c4cd"/>
    <rect x="60" y="8" width="26" height="20" rx="2" fill="#8fa1b3"/>
  </g>
  <text x="906" y="584" class="body">4 × modeled AC rooms</text>
  <text x="906" y="606" class="body">plain Wi-Fi MQTT + HTTP</text>
  <text x="906" y="628" class="body">software only · no mains</text>
  <text x="795" y="674" class="small">Isolate this traffic · scenario data, not live monitoring</text>

  <!-- flow arrows: laptop, enclosure, wroom -->
  <path d="M200 516 V474 H470 V444" class="flow"/>
  <text x="214" y="470" class="small">HTTPS · WebSocket · ACK</text>
  <path d="M580 444 V516" class="flow"/>
  <text x="596" y="486" class="small">serial default / optional MQTT</text>
  <path d="M700 444 V480 H900 V516" class="net"/>
  <text x="716" y="474" class="small">Wi-Fi MQTT (unauthenticated)</text>

  <text x="36" y="726" class="note">Illustration of the documented hardware — not photographs; verify actual board revisions and pinouts in the hardware guide.</text>
  <text x="36" y="752" class="note">Control messages are requests, not proof of actuation · SMTP acceptance is not inbox delivery · keep the anonymous broker off the public Internet.</text>
</svg>
