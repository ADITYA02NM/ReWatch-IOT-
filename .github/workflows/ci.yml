name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Unit and API tests
        run: python -m pytest -o addopts='' -q
      - name: Install firmware parser dependency
        run: |
          python -m pip install platformio==6.1.18
          python -m platformio pkg install \
            --project-dir firmware/esp32-c3-indicator \
            --environment esp32-c3-devkitm-1 \
            --library "bblanchon/ArduinoJson@7.4.3" \
            --no-save
      - name: Lint and syntax
        run: |
          ruff check . --select F
          bash -n start.sh tools/node-install.sh demo/run.sh
          for script in pi4-core/web/assets/*.js demo/web/assets/*.js; do node --check "$script"; done
          python firmware/tests/check_indicator.py
      - name: Install isolated browser
        run: python -m playwright install --with-deps chromium
      - name: Browser regression
        run: python tests/browser_demo.py
