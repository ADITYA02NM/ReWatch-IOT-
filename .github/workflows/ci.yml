name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install paho-mqtt==2.1.0 pytest
      - name: Unit tests
        run: python -m pytest tests/test_engine.py tests/test_detectors.py -q
