; ReWatch — ESP32-C3 indicator (OLED score + NeoPixel band).
; Default build is USB-serial only: the Pi 4 writes newline JSON at 115200.
; Drop include/secrets.h in to ALSO mirror the MQTT broker (no cable needed).
[env:esp32-c3-devkitm-1]
platform  = espressif32
board     = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SSD1306 @ ^2.5.7
    adafruit/Adafruit GFX Library @ ^1.11.9
    bblanchon/ArduinoJson @ ^7.0.4
    adafruit/Adafruit NeoPixel @ ^1.12.0
    knolleary/PubSubClient @ ^2.8
build_flags =
    -D REWATCH_C3_INDICATOR
