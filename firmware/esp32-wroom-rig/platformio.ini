; ReWatch — ESP32-WROOM room rig.
; Models the building's AC controllers as real MQTT/HTTP devices: it publishes
; telemetry, obeys setpoint commands, serves /status for the Pi 4 Wi-Fi verifier,
; and runs the "AC spike" demo scenario. Switch it off and keep it aside when the
; real IoT devices are present; the rest of the system does not depend on it.
[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8

; Compile-only check with public placeholder values, never a deployment image.
[env:compile-check]
extends = env:esp32dev
build_flags = -D REWATCH_BUILD_CHECK
